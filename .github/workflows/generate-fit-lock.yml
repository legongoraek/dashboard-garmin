name: Generate FIT lockfiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-fit-lock.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Generate lockfiles
        working-directory: client
        run: npm install @garmin/fitsdk@21.214.0 --save-exact --package-lock-only --ignore-scripts
      - name: Verify install plan
        working-directory: client
        run: npm ci --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: fit-lockfiles
          path: |
            client/package.json
            client/package-lock.json
          if-no-files-found: error
